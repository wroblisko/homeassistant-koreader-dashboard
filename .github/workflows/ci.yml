name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The mock server must replay the captured Home Assistant responses 1:1.
  mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Mock matches the captured fixtures
        run: bash scripts/check_mock.sh

  # Pure-Lua unit tests (model, data, HA client, i18n, util). No KOReader build needed.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "luajit-2.1.0-beta3"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install busted and dkjson
        run: luarocks install busted && luarocks install dkjson
      - name: busted
        run: busted --lpath='./homedash.koplugin/?.lua' spec
