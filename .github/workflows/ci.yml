name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The mock server must replay the captured Home Assistant responses 1:1.
  mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Mock matches the captured fixtures
        run: bash scripts/check_mock.sh

  # Pure-Lua unit tests (model, data, HA client, i18n, util). No KOReader build needed.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1, luarocks, busted and dkjson
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install busted
          sudo luarocks --lua-version=5.1 install dkjson
      - name: Unit tests
        run: bash scripts/test.sh
